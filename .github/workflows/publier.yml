name: Publier le site

on:
  push:
    branches: [main]
  # Les nouvelles livraisons DVF sortent deux fois par an (avril et octobre) :
  # une reconstruction mensuelle suffit à les prendre en compte.
  schedule:
    - cron: "23 3 5 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Tests
        run: python -m pytest -q scripts

      # Garde les fichiers DVF téléchargés d'une exécution à l'autre pendant un mois
      - name: Mois courant
        id: mois
        run: echo "valeur=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache-dvf
          key: dvf-${{ steps.mois.outputs.valeur }}

      - name: Préparer les données DVF
        run: python scripts/build_data.py --out site/data --cache .cache-dvf

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Estime 3 000 ventes réelles de l'année écoulée comme si elles n'avaient pas encore eu lieu,
      # puis compare au prix payé. Le résultat est affiché sur le site.
      - name: Mesurer la précision
        run: node scripts/mesurer_precision.js site/data 3000

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
